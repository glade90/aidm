# AIDM remote deterministic regression (first increment)
# No external LLM calls or stored API credentials.
name: AIDM Windows regression

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact 40-character Git commit SHA to test (e.g. PR head)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  regression:
    name: Python 3.12 + browser Node regression
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Confirm exact source identity and clean tree
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.event.pull_request.head.sha }}
        run: |
          $sha = (git rev-parse HEAD).Trim()
          Write-Output "Checked out SHA: $sha"
          if ($env:EXPECTED_SHA -notmatch '^[0-9a-fA-F]{40}$') { throw "Expected SHA must be exactly 40 hex characters" }
          if ($sha -ne $env:EXPECTED_SHA) { throw "Source SHA mismatch" }
          if ((git status --porcelain).Length -ne 0) { throw "Source checkout is dirty" }
          Write-Output "Exact clean source: PASS"

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python development requirements
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed" }
          python -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { throw "Requirements install failed" }
          python --version
          node --version

      - name: Focused Python regression
        id: focused
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force reports | Out-Null
          if (Test-Path "aidm/combat/test/test_narration_gateway_00421.py") {
            python -m pytest aidm/combat/test/test_narration_contract.py aidm/combat/test/test_narration_gateway_00421.py -q 2>&1 | Tee-Object -FilePath reports/focused.txt
          } else {
            python -m pytest aidm/combat/test/test_round_agent.py -q 2>&1 | Tee-Object -FilePath reports/focused.txt
          }
          if ($LASTEXITCODE -ne 0) { throw "Focused pytest regression failed" }

      - name: Full Python regression and coverage >=90%
        id: python
        continue-on-error: true
        shell: pwsh
        run: |
          python -m aidm.test_runner
          if ($LASTEXITCODE -ne 0) { throw "Canonical Python regression failed" }

      - name: Browser JavaScript regression
        id: node
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force reports | Out-Null
          node --test aidm/web/test/chat_client.test.mjs aidm/web/test/combat_client.test.mjs 2>&1 | Tee-Object -FilePath reports/node-tap.txt
          if ($LASTEXITCODE -ne 0) { throw "Node browser tests failed" }

      - name: Emit auditable source and test receipt
        if: always()
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.event.pull_request.head.sha }}
          FOCUSED_OUTCOME: ${{ steps.focused.outcome }}
          PYTHON_OUTCOME: ${{ steps.python.outcome }}
          NODE_OUTCOME: ${{ steps.node.outcome }}
        run: |
          New-Item -ItemType Directory -Force reports | Out-Null
          $sha = (git rev-parse HEAD).Trim()
          $dirty = (git status --porcelain).Length -ne 0
          $lines = @(
            "# AIDM remote regression",
            "",
            "- Tested SHA: $sha",
            "- Expected SHA: $env:EXPECTED_SHA",
            "- Git worktree dirty: $dirty",
            "- Focused tests: $env:FOCUSED_OUTCOME",
            "- Canonical Python + coverage gate: $env:PYTHON_OUTCOME",
            "- Node browser tests: $env:NODE_OUTCOME",
            "- Run: $env:GITHUB_RUN_ID (attempt $env:GITHUB_RUN_ATTEMPT)"
          )
          $lines | Out-File -FilePath reports/ci-receipt.md -Encoding utf8
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload durable regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aidm-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/test-runs/
            reports/focused.txt
            reports/node-tap.txt
            reports/ci-receipt.md
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce combined gate
        if: always()
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.event.pull_request.head.sha }}
          FOCUSED_OUTCOME: ${{ steps.focused.outcome }}
          PYTHON_OUTCOME: ${{ steps.python.outcome }}
          NODE_OUTCOME: ${{ steps.node.outcome }}
        run: |
          $sha = (git rev-parse HEAD).Trim()
          if ($sha -ne $env:EXPECTED_SHA) { throw "Source identity failed" }
          if ((git status --porcelain).Length -ne 0) { throw "Checkout is dirty" }
          if ($env:FOCUSED_OUTCOME -ne "success") { throw "Focused tests did not pass" }
          if ($env:PYTHON_OUTCOME -ne "success") { throw "Python coverage regression did not pass" }
          if ($env:NODE_OUTCOME -ne "success") { throw "Browser JavaScript regression did not pass" }
          Write-Output "AIDM remote regression PASS at $sha"
